<!-- IPS /slots: Page Settings > Custom Code > BODY -->
<script>
/* IPS: stretches the section edge to edge + review carousel arrows */
(function () {
  function bleed() {
    var root = document.getElementById('ipt-root');
    if (!root) return;
    root.style.marginLeft = '0';
    root.style.width = '100%';
    /* AC's Embed block clips its content (overflow:hidden) and its section adds side
       padding on phones, which left white strips at the edges: let the section overflow */
    for (var el = root.parentElement; el && el !== document.body; el = el.parentElement) {
      if (getComputedStyle(el).overflowX !== 'visible') el.style.overflowX = 'visible';
      if (getComputedStyle(el).overflowY === 'hidden') el.style.overflowY = 'visible';
    }
    var left = root.getBoundingClientRect().left;
    root.style.width = document.documentElement.clientWidth + 'px';
    root.style.marginLeft = (-left) + 'px';
  }
  window.addEventListener('resize', bleed);
  window.addEventListener('load', bleed);
  document.addEventListener('DOMContentLoaded', bleed);
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#ipt-root .ipt-arrow');
    if (!btn) return;
    var track = btn.parentNode.querySelector('.ipt-track');
    var card = track.querySelector('.ipt-rev');
    var step = card ? card.getBoundingClientRect().width + 20 : track.clientWidth;
    track.scrollBy({ left: btn.classList.contains('ipt-prev') ? -step : step, behavior: 'smooth' });
  });
})();
</script>
<script>
/* IPS: load Calendly and start the inline widget (also works if the builder strips data-url) */
(function () {
  var URL = 'https://calendly.com/assistant-ipsp/free-call?hide_event_type_details=1&hide_gdpr_banner=1&primary_color=1c2a54&background_color=ffffff';
  function start() {
    var el = document.querySelector('#ipt-root .calendly-inline-widget');
    if (!el || !window.Calendly || el.querySelector('iframe')) return;
    el.innerHTML = '';
    window.Calendly.initInlineWidget({ url: URL, parentElement: el });
  }
  var s = document.createElement('script');
  s.src = 'https://assets.calendly.com/assets/external/widget.js';
  s.async = true;
  s.onload = function () { setTimeout(start, 300); };
  document.head.appendChild(s);
})();
</script>
