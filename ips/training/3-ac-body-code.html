<script>
/* IPS: stretches the section edge to edge + review carousel arrows */
(function () {
  function bleed() {
    var root = document.getElementById('ipt-root');
    if (!root) return;
    root.style.marginLeft = '0';
    root.style.width = '100%';
    var left = root.getBoundingClientRect().left;
    root.style.width = document.documentElement.clientWidth + 'px';
    root.style.marginLeft = (-left) + 'px';
  }
  window.addEventListener('resize', bleed);
  window.addEventListener('load', bleed);
  document.addEventListener('DOMContentLoaded', bleed);
  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('#ipt-root .ipt-arrow');
    if (!btn) return;
    var track = btn.parentNode.querySelector('.ipt-track');
    var card = track.querySelector('.ipt-rev');
    var step = card ? card.getBoundingClientRect().width + 20 : track.clientWidth;
    track.scrollBy({ left: btn.classList.contains('ipt-prev') ? -step : step, behavior: 'smooth' });
  });
})();
</script>
<script>
/* IPS: adds the training video back if the page builder strips iframes */
(function () {
  function addVideo() {
    var box = document.getElementById('ipt-yt');
    if (!box || box.querySelector('iframe')) return;
    var f = document.createElement('iframe');
    f.src = 'https://drive.google.com/file/d/1anFYqjKENSLUaq_8_gBikBa1bGGRusUD/preview';
    f.title = 'Free training with Violet Giannone, RN';
    f.allow = 'autoplay; fullscreen';
    f.allowFullscreen = true;
    box.insertBefore(f, box.firstChild);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', addVideo); else addVideo();
})();
</script>
<script>
/* IPS: every "Book your free Career Call" button opens the JotForm in a pop-up.
   To connect the form, put the JotForm form ID below (the number at the end of its link). */
(function () {
  var JOTFORM_ID = '262803770587365';   /* Meta ads: Free Call Application */

  var CSS =
    '#ipt-modal{position:fixed;inset:0;z-index:2147483000;display:none}' +
    '#ipt-modal.is-open{display:flex;align-items:center;justify-content:center;padding:16px}' +
    '#ipt-modal .ipt-m-backdrop{position:absolute;inset:0;background:rgba(13,20,42,.78);backdrop-filter:blur(3px)}' +
    '#ipt-modal .ipt-m-box{position:relative;width:100%;max-width:640px;max-height:calc(100vh - 32px);overflow-y:auto;' +
      'background:#fff;border-radius:16px;border-top:4px solid #dab965;padding:0;' +
      'box-shadow:0 30px 80px rgba(0,0,0,.5);animation:ipt-pop .22s ease-out;-webkit-overflow-scrolling:touch}' +
    '@keyframes ipt-pop{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}' +
    '#ipt-modal .ipt-m-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border-radius:50%;border:0;' +
      'background:rgba(255,255,255,.92);color:#1c2a54;font-size:24px;line-height:1;cursor:pointer;padding:0 0 2px;z-index:2;box-shadow:0 2px 8px rgba(0,0,0,.15)}' +
    '#ipt-modal .ipt-m-x:hover{background:#e3e7f0}' +
    '#ipt-modal iframe{display:block;width:100%;min-height:560px;border:0}' +
    '#ipt-modal .ipt-m-wait{min-height:300px;margin:16px;border:2px dashed #cfd5e6;border-radius:12px;background:#f8f9fc;' +
      'display:flex;align-items:center;justify-content:center;text-align:center;color:#8a91a6;' +
      'font:600 14px/1.5 "IBM Plex Sans",Helvetica,Arial,sans-serif;padding:24px}' +
    '#ipt-modal .ipt-m-head{padding:34px 28px 18px!important;text-align:center!important;font-family:"IBM Plex Sans",Helvetica,Arial,sans-serif!important;color:#5b6275!important;border-bottom:1px solid #e3e6ef}' +
    '#ipt-modal .ipt-m-head h2{font-family:Cardo,Georgia,serif!important;font-weight:400!important;font-size:27px!important;line-height:1.2!important;color:#1c2a54!important;margin:0 0 10px!important;padding:0 28px!important;text-transform:none!important;letter-spacing:normal!important}' +
    '#ipt-modal .ipt-m-head h2 em{font-style:italic;color:#314994!important;white-space:nowrap}' +
    '#ipt-modal .ipt-m-head p{margin:0 0 6px!important;padding:0!important;font-size:15px!important;line-height:1.5!important;color:#5b6275!important;font-family:inherit!important}' +
    '#ipt-modal .ipt-m-head p.ipt-m-fast{font-weight:700!important;color:#1c2a54!important;font-size:16px!important}' +
    '#ipt-modal .ipt-m-head p.ipt-m-start{margin:12px 0 0!important;font-weight:700!important;color:#1c2a54!important;display:inline-flex!important;align-items:center;gap:6px}' +
    '#ipt-modal .ipt-m-head svg{width:17px;height:17px;stroke:#dab965;stroke-width:2.6;fill:none}' +
    '@media (max-width:600px){#ipt-modal .ipt-m-head{padding:30px 16px 14px!important}#ipt-modal .ipt-m-head h2{font-size:23px!important;padding:0 22px!important}}' +
    'html.ipt-m-lock,html.ipt-m-lock body{overflow:hidden!important}';

  var modal, box, lastFocus, handlerLoaded = false;

  function formUrl() {
    /* prefill: ?email= / utm_* from the page link, plus the name/email/phone the visitor
       typed into the /access form (saved in their browser). The page link wins on conflicts. */
    var params = new URLSearchParams(window.location.search);
    try {
      var lead = JSON.parse(localStorage.getItem('ips_lead') || 'null');
      if (lead && Date.now() - (lead.t || 0) < 30 * 864e5) {
        var add = { 'firstName': lead.firstName, 'email': lead.email, 'phoneNumber[area]': lead.area, 'phoneNumber[phone]': lead.phone };
        for (var k in add) if (add[k] && !params.has(k)) params.set(k, add[k]);
      }
    } catch (err) {}
    var q = params.toString();
    return 'https://form.jotform.com/' + JOTFORM_ID + (q ? '?' + q : '');
  }

  function build() {
    if (!document.getElementById('ipt-modal-css')) {
      var st = document.createElement('style'); st.id = 'ipt-modal-css'; st.textContent = CSS;
      document.head.appendChild(st);
    }
    modal = document.createElement('div');
    modal.id = 'ipt-modal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-label', 'Book your free Career Call');
    modal.innerHTML = '<div class="ipt-m-backdrop" data-close></div>' +
      '<div class="ipt-m-box"><button type="button" class="ipt-m-x" aria-label="Close" data-close>&times;</button>' +
        '<div class="ipt-m-head">' +
          '<h2>Quick questions so we can <em>prepare for you</em></h2>' +
          '<p class="ipt-m-fast">This takes less than 30 seconds.</p>' +
          '<p>Once completed, you\'ll unlock access to the calendar to book your call.</p>' +
          '<p class="ipt-m-start">Start below <svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg></p>' +
        '</div>' +
      '</div>';
    document.body.appendChild(modal);
    box = modal.querySelector('.ipt-m-box');
    if (JOTFORM_ID) {
      var f = document.createElement('iframe');
      f.id = 'JotFormIFrame-' + JOTFORM_ID;
      f.title = 'Book your free Career Call';
      f.src = formUrl();
      f.setAttribute('allow', 'geolocation; microphone; camera; fullscreen; payment');
      f.setAttribute('allowtransparency', 'true');
      f.setAttribute('scrolling', 'no');
      box.appendChild(f);
      /* JotForm's own helper resizes the iframe to fit the form */
      if (!handlerLoaded) {
        handlerLoaded = true;
        var h = document.createElement('script');
        h.src = 'https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js';
        h.onload = function () {
          if (window.jotformEmbedHandler) window.jotformEmbedHandler("iframe[id='JotFormIFrame-" + JOTFORM_ID + "']", 'https://form.jotform.com/');
        };
        document.head.appendChild(h);
      }
    } else {
      var w = document.createElement('div');
      w.className = 'ipt-m-wait';
      w.innerHTML = 'JOTFORM GOES HERE<br>(waiting for the form ID)';
      box.appendChild(w);
    }
    modal.addEventListener('click', function (e) { if (e.target.hasAttribute('data-close')) close(); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && modal.classList.contains('is-open')) close(); });
  }
  function open() {
    if (!modal) build();
    lastFocus = document.activeElement;
    modal.classList.add('is-open');
    document.documentElement.classList.add('ipt-m-lock');
    var x = modal.querySelector('.ipt-m-x'); if (x) x.focus({ preventScroll: true });
  }
  function close() {
    modal.classList.remove('is-open');
    document.documentElement.classList.remove('ipt-m-lock');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href="#APPLY"]');
    if (!a) return;
    e.preventDefault();
    open();
  });
})();
</script>
