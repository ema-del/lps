<style>
  @import url('https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

  /* reset whatever the ActiveCampaign theme applies to these tags */
  #ips-root, #ips-root h1, #ips-root h2, #ips-root p, #ips-root ul, #ips-root li,
  #ips-root span, #ips-root div, #ips-root section, #ips-root img {
    margin: 0; padding: 0; border: 0; max-width: none;
    text-transform: none; letter-spacing: normal; text-align: inherit;
    line-height: inherit; color: inherit; font-family: inherit; font-weight: inherit;
    background: none; box-shadow: none; list-style: none; float: none;
  }
  #ips-root { display: block; width: 100%; line-height: 1.5; text-align: left; position: relative; }
  /* some AC themes force heading/paragraph margins with !important */
  #ips-root .ips-h1 { margin: 0 0 18px !important; }
  #ips-root .ips-sub { margin: 0 auto !important; }
  #ips-root .ips-form-title { margin: 0 0 6px !important; }
  #ips-root .ips-form-note { margin: 0 0 20px !important; }
  #ips-root .ips-safe { margin: 14px 0 0 !important; }
  #ips-root .ips-trust-h { margin: 0 0 6px !important; }
  #ips-root .ips-eyebrow { margin: 0 0 32px !important; }
  #ips-root .ips-checks { margin: 0 auto 36px !important; padding: 0 !important; }

  #ips-root {
    --ips-navy: #1c2a54;
    --ips-navy-2: #314994;
    --ips-navy-deep: #131d3c;
    --ips-gold: #dab965;
    --ips-gold-soft: #f3e7c4;
    --ips-ink: #1a1a1a;
    --ips-muted: #5b6275;
    --ips-gray: #f4f4f4;
    font-family: 'IBM Plex Sans', Helvetica, Arial, sans-serif;
    color: var(--ips-ink);
    -webkit-font-smoothing: antialiased;
  }
  #ips-root *, #ips-root *::before, #ips-root *::after { box-sizing: border-box; }

  /* ---------- HERO ---------- */
  #ips-root .ips-hero {
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(900px 420px at 18% 62%, rgba(49, 73, 148, .55), transparent 70%),
      radial-gradient(700px 380px at 92% 10%, rgba(218, 185, 101, .12), transparent 70%),
      linear-gradient(180deg, var(--ips-navy-deep) 0%, var(--ips-navy) 100%);
    color: #fff;
    padding: 64px 20px 80px;
  }
  #ips-root .ips-hero::after {
    /* soft moon-glow ring, nod to the logo */
    content: "";
    position: absolute;
    width: 520px; height: 520px;
    right: -180px; top: -200px;
    border-radius: 50%;
    border: 1px solid rgba(218, 185, 101, .18);
    pointer-events: none;
  }
  #ips-root .ips-container { max-width: 1120px; margin: 0 auto; position: relative; z-index: 1; }

  #ips-root .ips-head { text-align: center; max-width: 860px; margin: 0 auto 48px; }
  #ips-root .ips-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(218, 185, 101, .45);
    font-size: 13px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: #fff;
    margin-bottom: 22px;
  }
  #ips-root .ips-pill-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ips-gold); }

  #ips-root .ips-h1 {
    font-family: 'Cardo', Georgia, serif;
    font-weight: 400;
    font-size: clamp(34px, 5vw, 56px);
    line-height: 1.12;
    margin: 0 0 18px;
    color: #fff;
  }
  #ips-root .ips-h1 em { font-style: italic; }
  #ips-root .ips-underline {
    position: relative;
    white-space: nowrap;
    color: var(--ips-gold);
  }
  #ips-root .ips-underline::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 4px;
    border-radius: 4px;
    background: var(--ips-gold);
    opacity: .85;
  }
  #ips-root .ips-sub {
    font-size: clamp(16px, 1.6vw, 18px);
    line-height: 1.6;
    color: rgba(255, 255, 255, .82);
    margin: 0 auto;
    max-width: 640px;
  }
  #ips-root .ips-sub strong { color: #fff; font-weight: 600; }

  /* two columns */
  #ips-root .ips-grid {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 40px;
    align-items: center;
  }

  /* video placeholder */
  #ips-root .ips-video {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    background:
      linear-gradient(135deg, rgba(28, 42, 84, .25), rgba(28, 42, 84, .65)),
      url("https://instituteofpediatricsleep.com/wp-content/uploads/2021/05/ipsp-hero.jpg") center / cover no-repeat,
      var(--ips-navy-2);
    border: 1px solid rgba(218, 185, 101, .5);
    box-shadow: 0 0 0 6px rgba(218, 185, 101, .08), 0 30px 70px rgba(0, 0, 0, .45);
    display: flex; align-items: center; justify-content: center;
  }
  #ips-root .ips-play {
    width: 78px; height: 78px; border-radius: 50%;
    background: var(--ips-gold);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 10px rgba(218, 185, 101, .25);
  }
  #ips-root .ips-play svg { width: 26px; height: 26px; margin-left: 4px; fill: var(--ips-navy); }
  #ips-root .ips-video { display: block; background: var(--ips-navy-deep) !important; cursor: pointer; }
  #ips-root .ips-video video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block;
    border: 0; margin: 0; padding: 0; max-width: 100%; min-width: 0;
  }
  #ips-root .ips-grid > * { min-width: 0; }
  #ips-root .ips-video-tag {
    position: absolute; left: 16px; bottom: 14px;
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #fff; background: rgba(19, 29, 60, .7);
    padding: 6px 10px; border-radius: 6px;
  }

  #ips-root .ips-host {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin-top: 20px;
  }
  #ips-root .ips-host img {
    width: 44px; height: 44px; border-radius: 50%;
    object-fit: cover; object-position: 60% 22%;
    border: 2px solid var(--ips-gold);
  }
  #ips-root .ips-host span {
    font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
    color: rgba(255, 255, 255, .75);
  }

  /* form placeholder */
  #ips-root .ips-form-card {
    background: #fff;
    color: var(--ips-ink);
    border-radius: 16px;
    padding: 28px 26px;
    border-top: 4px solid var(--ips-gold);
