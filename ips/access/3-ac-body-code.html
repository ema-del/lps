<script>
/* IPS: stretches the section edge to edge on the page */
(function () {
  function bleed() {
    var root = document.getElementById('ips-root');
    if (!root) return;
    root.style.marginLeft = '0';
    root.style.width = '100%';
    /* AC's Embed block clips its content (overflow:hidden) and its section adds side
       padding on phones, which left white strips at the edges: let the section overflow */
    for (var el = root.parentElement; el && el !== document.body; el = el.parentElement) {
      if (getComputedStyle(el).overflowX !== 'visible') el.style.overflowX = 'visible';
      if (getComputedStyle(el).overflowY === 'hidden') el.style.overflowY = 'visible';
    }
    var left = root.getBoundingClientRect().left;
    root.style.width = document.documentElement.clientWidth + 'px';
    root.style.marginLeft = (-left) + 'px';
  }
  window.addEventListener('resize', bleed);
  window.addEventListener('load', bleed);
  document.addEventListener('DOMContentLoaded', bleed);
})();
</script>
<script>
/* IPS: keep the preview loop playing (adds it back if the builder strips <video>),
   and make a click on it open the form in a pop-up. Also loads the JotForm opt-in. */
(function () {
  var BASE = 'https://cdn.jsdelivr.net/gh/ema-del/lps@92763173e6e9592574f7dabafc764c565cb594c8/ips/access/media/';
  function setup() {
    var box = document.getElementById('ips-video-slot');
    if (!box) return;
    var v = box.querySelector('video');
    if (!v) {
      v = document.createElement('video');
      v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true;
      v.setAttribute('muted', ''); v.setAttribute('playsinline', '');
      v.poster = BASE + 'vsl-poster.jpg';
      v.src = BASE + 'vsl-preview.mp4';
      box.appendChild(v);
    }
    v.muted = true;
    var p = v.play && v.play(); if (p && p.catch) p.catch(function () {});
    box.addEventListener('click', function (e) {
      e.preventDefault();
      openPopup();
    });
  }

  /* ---------- JotForm opt-in (on the page + in the video pop-up) ---------- */
  var JF_ID = '262984250929368';
  var handlerState = 0, handlerQueue = [];
  function formUrl() {
    /* pass ?utm_source=... etc. from the page link into the form's hidden UTM fields */
    var q = window.location.search ? window.location.search.slice(1) : '';
    return 'https://form.jotform.com/' + JF_ID + (q ? '?' + q : '');
  }
  function autoHeight(id) {
    /* JotForm's own helper resizes each frame to fit the form */
    handlerQueue.push(id);
    var run = function () {
      while (handlerQueue.length) {
        var x = handlerQueue.shift();
        if (window.jotformEmbedHandler) window.jotformEmbedHandler("iframe[id='" + x + "']", 'https://form.jotform.com/');
      }
    };
    if (handlerState === 2) return run();
    if (handlerState === 1) return;
    handlerState = 1;
    var h = document.createElement('script');
    h.src = 'https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js';
    h.onload = function () { handlerState = 2; run(); };
    document.head.appendChild(h);
  }
  function makeFrame(parent, id) {
    if (!parent || parent.querySelector('iframe')) return;
    var f = document.createElement('iframe');
    f.id = id;
    f.title = 'Get instant access to the free training';
    f.src = formUrl();
    f.setAttribute('allow', 'geolocation; microphone; camera; fullscreen; payment');
    f.setAttribute('allowtransparency', 'true');
    f.setAttribute('scrolling', 'no');
    f.setAttribute('frameborder', '0');
    parent.appendChild(f);
    autoHeight(id);
  }
  function inlineForm() { makeFrame(document.getElementById('ips-form-slot'), 'JotFormIFrame-' + JF_ID); }

  /* pop-up: opens its own copy of the form (moving a JotForm would reload it and wipe what was typed) */
  var MODAL_CSS = "  /* ---------- FORM POP-UP (opened by clicking the video) ---------- */\n  #ips-root #ips-modal { position: fixed; inset: 0; z-index: 2147483000; display: none; }\n  #ips-root #ips-modal.is-open { display: flex; align-items: center; justify-content: center; padding: 16px; }\n  #ips-root .ips-modal-backdrop { position: absolute; inset: 0; background: rgba(13, 20, 42, .78); backdrop-filter: blur(3px); }\n  #ips-root .ips-modal-box {\n    position: relative; width: 100%; max-width: 480px; max-height: calc(100vh - 32px); overflow-y: auto;\n    background: #fff; color: var(--ips-ink); border-radius: 16px; border-top: 4px solid var(--ips-gold);\n    padding: 30px 26px 24px; box-shadow: 0 30px 80px rgba(0, 0, 0, .5);\n    animation: ips-pop .22s ease-out;\n  }\n  @keyframes ips-pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }\n  #ips-root .ips-modal-x {\n    position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%;\n    border: 0; background: #f1f3f8; color: var(--ips-navy); font-size: 24px; line-height: 1; cursor: pointer; padding: 0 0 2px;\n  }\n  #ips-root .ips-modal-x:hover { background: #e3e7f0; }\n  html.ips-modal-lock, html.ips-modal-lock body { overflow: hidden !important; }\n  @media (max-width: 900px) { #ips-root .ips-modal-box { padding: 26px 18px 20px; } }\n";
  var modal, holder, lastFocus;
  function buildPopup() {
    /* the pop-up carries its own styles, so it works even if the Header code is older */
    if (!document.getElementById('ips-modal-css')) {
      var st = document.createElement('style');
      st.id = 'ips-modal-css';
      st.textContent = MODAL_CSS;
      document.head.appendChild(st);
    }
    modal = document.createElement('div');
    modal.id = 'ips-modal';
    modal.setAttribute('role', 'dialog');
    modal.setAttribute('aria-modal', 'true');
    modal.setAttribute('aria-label', 'Get instant access to the free training');
    modal.innerHTML =
      '<div class="ips-modal-backdrop" data-close></div>' +
      '<div class="ips-modal-box">' +
        '<button type="button" class="ips-modal-x" aria-label="Close" data-close>&times;</button>' +
        '<h2 class="ips-form-title">Get <em>instant access</em> to the free training</h2>' +
        '<p class="ips-form-note">Takes 30 seconds.</p>' +
        '<div class="ips-modal-form"></div>' +
        '<p class="ips-safe"><svg viewBox="0 0 24 24"><path d="M12 1l9 4v6c0 5.6-3.8 10.7-9 12-5.2-1.3-9-6.4-9-12V5l9-4z"/></svg>Your info is safe with us. Unsubscribe any time.</p>' +
      '</div>';
    /* inside #ips-root so the page styles apply */
    document.getElementById('ips-root').appendChild(modal);
    holder = modal.querySelector('.ips-modal-form');
    modal.addEventListener('click', function (e) {
      if (e.target.hasAttribute('data-close')) closePopup();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('is-open')) closePopup();
    });
  }
  function openPopup() {
    if (!modal) buildPopup();
    makeFrame(holder, 'JotFormIFrame-' + JF_ID + '-popup');
    lastFocus = document.activeElement;
    modal.classList.add('is-open');
    document.documentElement.classList.add('ips-modal-lock');
    var x = modal.querySelector('.ips-modal-x'); if (x) x.focus({ preventScroll: true });
  }
  function closePopup() {
    modal.classList.remove('is-open');
    document.documentElement.classList.remove('ips-modal-lock');
    if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
  }
  function start() { setup(); inlineForm(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
