<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  .pacow-hero {
    --pc-purple: #7C3AFF;
    --pc-purple-hover: #6a2be0;
    --pc-bg: #0A0A0F;
    --pc-white: #FDFBFF;
    --pc-grid: #1E1C2A;
    --pc-text-muted: rgba(253, 251, 255, 0.55);
    --pc-font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    position: relative; width: 100vw; max-width: 100vw;
    margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw);
    background-color: var(--pc-bg);
    background-image:
      linear-gradient(to right, rgba(30, 28, 42, 0.5) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(30, 28, 42, 0.5) 1px, transparent 1px);
    background-size: 36px 36px;
    font-family: var(--pc-font); color: var(--pc-white);
    overflow: hidden; padding: 0; box-sizing: border-box;
  }
  .pacow-hero *, .pacow-hero *::before, .pacow-hero *::after { box-sizing: border-box; }
  .pacow-hero::before {
    content: ''; position: absolute; top: -10%; left: 50%; transform: translateX(-50%);
    width: 760px; height: 520px;
    background: radial-gradient(ellipse at center, rgba(124, 58, 255, 0.18), transparent 65%);
    pointer-events: none; z-index: 0;
  }
  .pacow-hero__inner { position: relative; z-index: 1; max-width: 820px; margin: 0 auto; padding: 24px 24px 48px; }

  /* Top bar */
  .pacow-hero__nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 34px; }
  .pacow-hero__logo-img { height: 22px; width: auto; display: block; }

  /* Step progress bar */
  .pacow-hero__stepbar {
    flex: 1; max-width: 560px; margin-left: 28px;
    position: relative; height: 40px; border-radius: 40px;
    background: #000000; border: 1px solid rgba(255,255,255,0.10); overflow: hidden;
  }
  .pacow-hero__stepbar-fill {
    position: absolute; left: 0; top: 0; height: 100%; width: 100%;
    background: var(--pc-purple); border-radius: 40px; overflow: hidden;
    animation: pacow-stepbar-glow 1.8s ease-in-out infinite;
  }
  @keyframes pacow-stepbar-glow {
    0%, 100% { box-shadow: 0 0 14px rgba(124,58,255,0.40); }
    50%      { box-shadow: 0 0 26px rgba(124,58,255,0.85); }
  }
  .pacow-hero__stepbar-fill::after {
    content: ''; position: absolute; top: 0; left: -45%; width: 45%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent);
    transform: skewX(-18deg);
    animation: pacow-stepbar-sweep 1.6s ease-in-out infinite;
  }
  @keyframes pacow-stepbar-sweep { 0% { left: -45%; } 70% { left: 120%; } 100% { left: 120%; } }
  .pacow-hero__stepbar-label {
    position: absolute; inset: 0; z-index: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 13.5px; font-weight: 700; color: var(--pc-white);
    letter-spacing: 0.01em; text-align: center; padding: 0 14px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
  }

  /* Headline */
  .pacow-hero__headline {
    text-align: center; font-size: 46px; line-height: 1.12;
    font-weight: 800; letter-spacing: -0.03em; margin: 0 auto 12px; max-width: 740px;
  }
  .pacow-hero__hl-mark {
    background: var(--pc-purple); color: var(--pc-white); border-radius: 12px; padding: 0 14px;
    box-decoration-break: clone; -webkit-box-decoration-break: clone;
  }
  .pacow-hero__subhead {
    text-align: center; font-size: 18px; line-height: 1.5;
    color: var(--pc-text-muted); font-weight: 600; margin: 0 auto 28px; max-width: 560px;
  }
  .pacow-hero__subhead b { color: var(--pc-white); font-weight: 700; }

  /* Booking widget block */
  .pacow-hero__cal { position: relative; width: 100%; max-width: 100%; margin: 0 auto; min-height: 700px; }
  .pacow-hero__cal iframe { width: 100%; position: relative; z-index: 1; border: none; }

  /* RESPONSIVE */
  @media (max-width: 768px) {
    .pacow-hero { background-size: 28px 28px; }
    .pacow-hero__inner { padding: 18px 18px 36px; }
    .pacow-hero__nav { margin-bottom: 26px; }
    .pacow-hero__logo-img { height: 21px; }
    .pacow-hero__stepbar { margin-left: 14px; height: 36px; }
    .pacow-hero__stepbar-label { font-size: 11px; }
    .pacow-hero__headline { font-size: 29px; margin-bottom: 10px; }
    .pacow-hero__subhead { font-size: 15px; margin-bottom: 22px; }
    .pacow-hero__badge { font-size: 11px; padding: 7px 12px; }
    .pacow-hero__hl-mark { padding: 0 8px; border-radius: 8px; }
  }
  @media (max-width: 390px) {
    .pacow-hero__headline { font-size: 26px; }
  }
</style>
