<!--
  ============================================================
  PACOW — SECTION 2: SOCIAL PROOF / TIERED SPOTLIGHT + EXPANDABLE GRID
  Light background · faint grid · Pacow violet accent
  ROW 1 = spotlight (partners 1, 2, 5, 8 — large)
  ROW 2 = quiet grid: 12 shown, rest hidden behind "show more" toggle
  No external JS — pure CSS checkbox toggle (works in GHL).

  Partner 1 feature cell uses ZERO padding (image is pre-padded).
  To feature different brands: swap the 4 URLs in .pacow-sp__spotlight.
  ============================================================
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  .pacow-sp {
    --pc-purple:#7C3AFF; --pc-white:#FDFBFF; --pc-ink:#0A0A0F;
    --pc-grid-light:rgba(10,10,15,0.025);
    --pc-line:rgba(10,10,15,0.07);
    --pc-font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    position:relative; width:100vw; max-width:100vw;
    margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
    background-color:var(--pc-white);
    background-image:linear-gradient(to right,var(--pc-grid-light) 1px,transparent 1px),linear-gradient(to bottom,var(--pc-grid-light) 1px,transparent 1px);
    background-size:32px 32px;
    font-family:var(--pc-font); overflow:hidden; box-sizing:border-box;
    padding:64px 24px;
  }
  .pacow-sp *,.pacow-sp *::before,.pacow-sp *::after{box-sizing:border-box;}

  .pacow-sp__inner{width:100%; max-width:980px; margin:0 auto;}

  .pacow-sp__label{
    text-align:center; color:var(--pc-ink);
    font-size:19px; font-weight:700; letter-spacing:0.02em; text-transform:uppercase;
    margin:0 0 8px;
  }
  .pacow-sp__label .num{color:var(--pc-purple);}
  .pacow-sp__sub{
    text-align:center; color:rgba(10,10,15,0.45);
    font-size:13px; font-weight:600; letter-spacing:0.12em; text-transform:uppercase;
    margin:0 0 40px;
  }

  /* ---------- SPOTLIGHT ROW ---------- */
  .pacow-sp__spotlight{
    display:grid; grid-template-columns:repeat(4,1fr);
    gap:18px; margin-bottom:30px;
  }
  .pacow-sp__feature{
    display:flex; align-items:center; justify-content:center;
    min-height:118px; padding:22px 18px;
    background:#fff;
    border:1px solid var(--pc-line);
    border-radius:16px;
    box-shadow:0 10px 30px -18px rgba(124,58,255,0.35), 0 2px 8px rgba(10,10,15,0.04);
    transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    overflow:hidden;
  }
  /* Partner 1: image is already padded -> fill bubble, zero padding/gap */
  .pacow-sp__feature--flush{padding:0; margin:0;}
  .pacow-sp__feature--flush img{
    height:100%; max-height:none; width:100%; max-width:100%;
    object-fit:cover; display:block; margin:0; padding:0;
    transform:scale(1.35); transform-origin:center;
  }
  .pacow-sp__feature:hover{
    transform:translateY(-4px);
    border-color:rgba(124,58,255,0.4);
    box-shadow:0 18px 40px -16px rgba(124,58,255,0.45), 0 4px 12px rgba(10,10,15,0.06);
  }
  .pacow-sp__feature img{
    height:62px; max-height:62px; width:auto; max-width:200px;
    object-fit:contain; display:block;
  }

  /* divider with centered caption */
  .pacow-sp__divider{
    display:flex; align-items:center; gap:18px;
    margin:0 0 30px; color:rgba(10,10,15,0.35);
    font-size:11px; font-weight:700; letter-spacing:0.16em; text-transform:uppercase;
  }
  .pacow-sp__divider::before,.pacow-sp__divider::after{
    content:""; flex:1; height:1px; background:var(--pc-line);
  }

  /* ---------- QUIET GRID ---------- */
  .pacow-sp__grid{
    display:grid; grid-template-columns:repeat(6,1fr);
    gap:12px 10px;
  }
  .pacow-sp__cell{
    display:flex; align-items:center; justify-content:center;
    min-height:74px; padding:14px 12px;
    border-radius:12px;
    transition:background .2s ease;
  }
  .pacow-sp__cell:hover{background:rgba(124,58,255,0.05);}
  .pacow-sp__cell img{
    height:34px; max-height:34px; width:auto; max-width:130px;
    object-fit:contain; display:block;
    opacity:0.62; filter:grayscale(100%);
    transition:opacity .25s ease, filter .25s ease;
  }
  .pacow-sp__cell:hover img{opacity:1; filter:grayscale(0%);}

  /* ---------- SHOW MORE (pure-CSS toggle) ---------- */
  .pacow-sp__toggle{position:absolute; opacity:0; pointer-events:none;}
  .pacow-sp__more{
    display:grid; grid-template-columns:repeat(6,1fr); gap:12px 10px;
    max-height:0; overflow:hidden; opacity:0;
    transition:max-height .45s ease, opacity .35s ease, margin .35s ease;
  }
  .pacow-sp__toggle:checked ~ .pacow-sp__more{
    max-height:1200px; opacity:1; margin-top:12px;
  }
  .pacow-sp__btnwrap{text-align:center; margin-top:30px;}
  .pacow-sp__btn{
    display:inline-flex; align-items:center; gap:9px;
    cursor:pointer; user-select:none;
    font-family:var(--pc-font); font-size:14px; font-weight:700;
    letter-spacing:0.03em; color:var(--pc-purple);
    background:rgba(124,58,255,0.07);
    border:1px solid rgba(124,58,255,0.28);
    padding:12px 26px; border-radius:999px;
    transition:background .2s ease, border-color .2s ease, transform .15s ease;
  }
  .pacow-sp__btn:hover{background:rgba(124,58,255,0.13); border-color:rgba(124,58,255,0.5);}
  .pacow-sp__btn:active{transform:scale(0.97);}
  .pacow-sp__btn .chev{transition:transform .3s ease;}
  .pacow-sp__btn .txt-less{display:none;}
  .pacow-sp__toggle:checked ~ .pacow-sp__btnwrap .pacow-sp__btn .chev{transform:rotate(180deg);}
  .pacow-sp__toggle:checked ~ .pacow-sp__btnwrap .pacow-sp__btn .txt-more{display:none;}
  .pacow-sp__toggle:checked ~ .pacow-sp__btnwrap .pacow-sp__btn .txt-less{display:inline;}

  /* ---------- RESPONSIVE ---------- */
  @media (max-width:900px){
    .pacow-sp__grid,.pacow-sp__more{grid-template-columns:repeat(4,1fr);}
  }
  @media (max-width:768px){
    .pacow-sp{padding:48px 16px; background-size:26px 26px;}
    .pacow-sp__label{font-size:15px;}
    .pacow-sp__sub{font-size:11px; margin:0 0 30px;}
    .pacow-sp__spotlight{grid-template-columns:repeat(2,1fr); gap:14px;}
    .pacow-sp__feature{min-height:96px; padding:18px 14px;}
    .pacow-sp__feature--flush{padding:0;}
    .pacow-sp__feature img{height:50px; max-height:50px; max-width:150px;}
    .pacow-sp__grid,.pacow-sp__more{grid-template-columns:repeat(3,1fr);}
    .pacow-sp__cell{min-height:62px; padding:10px;}
    .pacow-sp__cell img{height:28px; max-height:28px; max-width:100px;}
  }
  @media (max-width:430px){
    .pacow-sp__grid,.pacow-sp__more{grid-template-columns:repeat(2,1fr);}
  }
</style>
