<!--
  PACOW (TRAINING FUNNEL) — v4 BLOCK 1 (white/light background)
  Mirrors what's live at https://lp.pacowmedia.com/opt-in - same
  headline, badge, form, and copy as that page. Background/text theme
  changed from void-black-grid to the light white-grid treatment
  already used elsewhere on that same page (the partner-logos section
  further down it is already white).

  STATUS: this is the committed direction going forward, not an A/B
  test - the opt-in hero's background is white from here on.

  NOTE: this headline ("The Meta ads system that gets education brands
  10-20+ new students every month") is the one live on /opt-in. A
  different live page, /opt-in-499877, runs a newer headline ("Add
  10-20 New Students Every Month With Meta Ads") - that's also what
  training-section-1-variant-b.html in this repo currently has. Those
  two pages' headlines still don't match each other; worth deciding
  whether to unify them.

  The watch-training and thank-you pages after this one are unchanged
  (still dark) - training-section-2-watch.html has a fade-in on load
  so that transition isn't a hard cut, which still matters even though
  this is no longer an A/B test.

  Real GHL form, visible, untouched. No iframe, no hidden form.
  Section A -> this block (badge, headline)
  Section B -> row: left = Block 2 (video), right = GHL Form "(Ads) Opt-In - OFFICIAL"
  Set margin/padding of Section A and Section B to 0 in GHL.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  /* ---------- shared tokens ---------- */
  .pacow-tr, .c-section:has(#form-builder){
    --pc-purple:#7C3AFF; --pc-purple-hover:#6a2be0;
    --pc-bg:#FDFBFF; --pc-ink:#0A0A0F;
    --pc-muted:rgba(10,10,15,0.55);
    --pc-font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  }

  /* ---------- SECTION A: top of hero (this block) ---------- */
  .pacow-tr {
    position:relative; width:100vw; max-width:100vw;
    margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
    background-color:var(--pc-bg);
    background-image:
      radial-gradient(ellipse 55% 80% at 50% 0%, rgba(124,58,255,0.10), rgba(124,58,255,0.03) 55%, transparent 100%),
      linear-gradient(to right,rgba(10,10,15,0.035) 1px,transparent 1px),
      linear-gradient(to bottom,rgba(10,10,15,0.035) 1px,transparent 1px);
    background-size:100% 100%, 36px 36px, 36px 36px;
    background-position:center top, center top, center top;
    background-repeat:no-repeat, repeat, repeat;
    font-family:var(--pc-font); color:var(--pc-ink); overflow:hidden; box-sizing:border-box;
  }
  .pacow-tr *,.pacow-tr *::before,.pacow-tr *::after{box-sizing:border-box;}
  .pacow-tr__inner{position:relative; z-index:1; max-width:1120px; margin:0 auto; padding:30px 24px 0;}
  .pacow-tr__badge{
    display:inline-flex; align-items:center; gap:9px;
    background:#FFFFFF; color:#14121C;
    border:1px solid rgba(10,10,15,0.10);
    box-shadow:0 2px 10px rgba(10,10,15,0.06);
    border-radius:40px; padding:8px 15px;
    font-size:13px; font-weight:600; margin:0 0 18px;
  }
  .pacow-tr__badge-dot{width:8px;height:8px;background:var(--pc-purple);border-radius:50%;display:inline-block;animation:pacow-tr-pulse 2s ease-in-out infinite;}
  @keyframes pacow-tr-pulse{0%{box-shadow:0 0 0 0 rgba(124,58,255,.6);}70%{box-shadow:0 0 0 7px rgba(124,58,255,0);}100%{box-shadow:0 0 0 0 rgba(124,58,255,0);}}
  .pacow-tr__headline{
    text-align:center; font-size:44px; line-height:1.35; font-weight:800; letter-spacing:-0.015em;
    margin:0 auto; padding-bottom:34px; max-width:960px; color:var(--pc-ink); text-wrap:balance;
  }
  .pacow-tr__pen{position:relative; white-space:nowrap; color:var(--pc-ink);}
  .pacow-tr__eyebrow-free{color:var(--pc-purple);}
  .pacow-tr__pen::after{
    content:''; position:absolute; left:0; right:0; bottom:-0.12em; height:0.16em;
    background:var(--pc-purple); border-radius:40px;
    box-shadow:0 0 14px rgba(124,58,255,0.6);
    transform:scaleX(0); transform-origin:left center;
    animation:pacow-tr-draw 0.7s cubic-bezier(0.4,0,0.2,1) 0.4s forwards;
  }
  @keyframes pacow-tr-draw{to{transform:scaleX(1);}}

  /* ---------- SECTION B: the GHL row (video left, form right) ---------- */
  .c-section:has(#form-builder){
    background-color:var(--pc-bg) !important;
    background-image:linear-gradient(to right,rgba(10,10,15,0.035) 1px,transparent 1px),linear-gradient(to bottom,rgba(10,10,15,0.035) 1px,transparent 1px) !important;
    background-size:36px 36px !important; background-position:center top !important;
    padding:0 24px 56px !important; margin:0 !important;
    font-family:var(--pc-font);
  }
  .c-row:has(> .inner > .c-column > .inner > .c-form){max-width:1120px !important; margin:0 auto !important;}
  .c-row:has(> .inner > .c-column > .inner > .c-form) > .inner{align-items:center !important;}

  /* video column (Block 2) */
  .pacow-tr-vid{position:relative;}
  .pacow-tr-vid__video{
    position:relative; width:100%; border-radius:22px; overflow:hidden; cursor:pointer; font-size:0;
    box-shadow:0 0 50px rgba(124,58,255,0.35),0 0 90px rgba(124,58,255,0.20),0 20px 60px rgba(10,10,15,0.15),0 0 0 1px rgba(124,58,255,0.18);
  }
  .pacow-tr-vid__video img{display:block; width:100%; height:auto; aspect-ratio:16/9; object-fit:cover; background:#FDFBFF;}
  .pacow-tr-vid__play{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    z-index:2; width:74px; height:74px; border-radius:50%;
    background:rgba(10,10,15,0.55); border:1.5px solid rgba(253,251,255,0.7);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px);
    animation:pacow-tr-playpulse 2.2s ease-in-out infinite; pointer-events:none;
    transition:transform .18s ease, background .18s ease;
  }
  .pacow-tr-vid:hover .pacow-tr-vid__play{transform:translate(-50%,-50%) scale(1.08); background:rgba(124,58,255,0.75);}
  .pacow-tr-vid__play svg{width:26px; height:26px; margin-left:4px;}
  @keyframes pacow-tr-playpulse{0%{box-shadow:0 0 0 0 rgba(124,58,255,.55);}70%{box-shadow:0 0 0 16px rgba(124,58,255,0);}100%{box-shadow:0 0 0 0 rgba(124,58,255,0);}}
  .pacow-tr-vid__host{display:flex; align-items:center; justify-content:center; gap:11px; margin-top:18px;}
  .pacow-tr-vid__host img{width:48px; height:48px; border-radius:50%; object-fit:cover; border:2px solid var(--pc-purple); box-shadow:0 0 0 4px rgba(124,58,255,0.18), 0 0 18px rgba(124,58,255,0.55);}
  .pacow-tr-vid__host span{font:700 13px var(--pc-font); letter-spacing:.05em; text-transform:uppercase; color:var(--pc-muted);}

  /* ---------- "Instant access" line + outline around the native GHL form ---------- */
  .c-form:has(#form-builder)::before{
    content:'Instant access to the free training in 30 sec!';
    display:block; text-align:center; font:700 15px var(--pc-font); color:var(--pc-ink); margin:0 0 4px; padding:0 16px;
  }
  .c-form:has(#form-builder) > [class^="cform-"]{padding:0 !important;}
  .c-column:has(> .inner > .c-form) #_builder-form{padding-left:16px !important; padding-right:16px !important;}
  .c-column:has(> .inner > .c-form) > .inner{
    border:1px solid rgba(124,58,255,0.25) !important; border-radius:16px !important;
    padding:16px 0 6px !important; background:#FFFFFF !important;
    box-shadow:0 10px 40px rgba(10,10,15,0.08) !important;
    max-width:440px !important; margin-left:auto !important; margin-right:auto !important;
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .c-column:has(> .inner > .c-form).pacow-tr--glow > .inner{
    border-color:rgba(124,58,255,0.7) !important;
    box-shadow:0 0 0 3px rgba(124,58,255,0.18), 0 0 40px rgba(124,58,255,0.25), 0 10px 40px rgba(10,10,15,0.08) !important;
  }

  /* ---------- hidden native GHL "Open Popup" button (very top of the page) ---------- */
  [id^="button-"].c-button{
    position:absolute !important; width:1px !important; height:1px !important;
    padding:0 !important; margin:0 !important; overflow:hidden !important;
    clip:rect(0 0 0 0) !important; opacity:0 !important; pointer-events:none !important;
  }

  /* ---------- shorter laptop screens (1366x768): keep "Get Access Now" on the first screen ---------- */
  @media (min-width:901px) and (max-height:860px){
    .pacow-tr__inner{padding-top:18px;}
    .pacow-tr__badge{margin-bottom:12px;}
    .pacow-tr__headline{font-size:38px; max-width:980px; padding-bottom:20px;}
    .c-column:has(> .inner > .c-form) > .inner{padding-top:10px !important;}
    .c-column:has(> .inner > .c-form) #_builder-form{padding-top:6px !important;}
    .c-column:has(> .inner > .c-form) #_builder-form .field-label{margin-bottom:4px !important;}
    .c-column:has(> .inner > .c-form) #_builder-form .form-builder--btn-submit{margin-top:6px !important;}
  }

  /* ---------- tablet / mobile ---------- */
  @media (max-width:900px){
    .pacow-tr__headline{font-size:36px; max-width:720px;}
    /* form first, video after */
    .c-row:has(> .inner > .c-column > .inner > .c-form) > .inner{flex-direction:column !important;}
    .c-column:has(> .inner > .c-form){order:-1 !important;}
  }
  @media (max-width:768px){
    .pacow-tr{background-size:100% 100%, 28px 28px, 28px 28px;}
    .c-section:has(#form-builder){background-size:28px 28px !important;}
    .pacow-tr__inner{padding:26px 18px 0;}
    .pacow-tr__badge{margin-bottom:16px; font-size:12px; padding:7px 13px; line-height:1.35; text-align:left; border-radius:18px;}
    .pacow-tr__headline{font-size:28px; padding-bottom:22px;}
    .c-section:has(#form-builder){padding:0 14px 48px !important;}
    .c-row:has(.c-form), .c-row:has(.c-form) .c-column{padding-left:0 !important; padding-right:0 !important;}
    .pacow-tr-vid__play{width:60px; height:60px;}
    .pacow-tr-vid__play svg{width:22px; height:22px;}
  }
</style>

<section class="pacow-tr">
  <div class="pacow-tr__inner">
    <div style="text-align:center;">
      <span class="pacow-tr__badge"><span class="pacow-tr__badge-dot"></span>Education brands &amp; course creators making $10k+/mo</span>
    </div>
    <h1 class="pacow-tr__headline"><span class="pacow-tr__eyebrow-free">FREE TRAINING:</span> The Meta ads system that gets education brands <span class="pacow-tr__pen">10-20+ new students</span> every month</h1>
  </div>
</section>

<script>
  /* Seamless background: Section B continues Section A's grid with no seam. */
  (function(){
    function align(){
      var a = document.querySelector('.pacow-tr');
      var secA = a && a.closest('.c-section');
      var b = secA && secA.nextElementSibling;
      if(!a || !b || !b.classList.contains('c-section')) return;
      var cell = window.innerWidth <= 768 ? 28 : 36;
      var off = a.getBoundingClientRect().height % cell;
      b.style.setProperty('background-position', 'center ' + (-off) + 'px', 'important');
    }
    align();
    window.addEventListener('load', align);
    window.addEventListener('resize', align);
    setTimeout(align, 1500);
    setTimeout(align, 3000);
  })();
</script>
