<!-- ============================================================ PACOW — SECTION 5: KEY STATS BAR Light background · faint grid (matches logo marquee) · 3 big stats · dividers Self-contained. ============================================================ -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
.pacow-stats {
  --pc-purple:#7C3AFF; --pc-white:#FDFBFF; --pc-ink:#0A0A0F;
  --pc-grid-light:rgba(10,10,15,0.025); --pc-muted:rgba(10,10,15,0.55);
  --pc-font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  position:relative;
  width:100vw; max-width:100vw;
  margin-left:calc(50% - 50vw); margin-right:calc(50% - 50vw);
  background-color:var(--pc-white);
  background-image:linear-gradient(to right,var(--pc-grid-light) 1px,transparent 1px),linear-gradient(to bottom,var(--pc-grid-light) 1px,transparent 1px);
  background-size:32px 32px;
  font-family:var(--pc-font);
  overflow:hidden;
  box-sizing:border-box;
  padding:64px 24px;
}
.pacow-stats *,.pacow-stats *::before,.pacow-stats *::after{box-sizing:border-box;}

.pacow-stats__grid{
  display:grid; grid-template-columns:1fr 1fr 1fr;
  max-width:880px; margin:0 auto;
}
.pacow-stats__item{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:8px 24px; position:relative;
}
/* divider between items */
.pacow-stats__item:not(:last-child)::after{
  content:''; position:absolute; right:0; top:50%; transform:translateY(-50%);
  width:1px; height:56px; background:rgba(10,10,15,0.10);
}
.pacow-stats__num{
  font-size:48px; font-weight:800; letter-spacing:-0.03em; line-height:1;
  color:var(--pc-ink); margin-bottom:10px;
}
.pacow-stats__num .accent{color:var(--pc-purple);}
.pacow-stats__label{
  font-size:15px; font-weight:500; color:var(--pc-muted); line-height:1.4;
}
@media (max-width:768px){
  .pacow-stats{padding:48px 18px; background-size:26px 26px;}
  .pacow-stats__grid{grid-template-columns:1fr; gap:34px; max-width:340px;}
  .pacow-stats__item{padding:0;}
  .pacow-stats__item:not(:last-child)::after{
    right:auto; left:50%; top:auto; bottom:-17px; transform:translateX(-50%);
    width:48px; height:1px;
  }
  .pacow-stats__num{font-size:42px;}
}
</style>
<section class="pacow-stats">
  <div class="pacow-stats__grid">
    <div class="pacow-stats__item">
      <div class="pacow-stats__num"><span class="accent">$5M+</span></div>
      <div class="pacow-stats__label">in client revenue generated</div>
    </div>
    <div class="pacow-stats__item">
      <div class="pacow-stats__num">4-7x</div>
      <div class="pacow-stats__label">average return on ad spend</div>
    </div>
    <div class="pacow-stats__item">
      <div class="pacow-stats__num">98%</div>
      <div class="pacow-stats__label">client satisfaction rate</div>
    </div>
  </div>
</section>
